<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--tx:#1b1f1d;--mu:#69736e;--g:#0a8f5b;--gd:#066b44;--tint:#eef3f1;--hero:linear-gradient(135deg,#e1f1fb,#dcf7e3);--ln:#dfe6e2;
--desk:#1f3a33;--desk2:#14271f;--bar:#10201a;--brass:#d2a64b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1512;--tx:#eef2ef;--mu:#9aa6a0;--g:#2fc287;--gd:#0a8f5b;--tint:#1a231f;--hero:linear-gradient(135deg,#17303d,#173a28);--ln:#26312c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1512;--tx:#eef2ef;--mu:#9aa6a0;--g:#2fc287;--gd:#0a8f5b;--tint:#1a231f;--hero:linear-gradient(135deg,#17303d,#173a28);--ln:#26312c}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
#home{height:100%;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:.75rem;padding:1rem 1.1rem .4rem}
.av{width:2.9rem;height:2.9rem;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.4rem}
.hd h1{flex:1;margin:0;font-size:1.25rem}
.pill{background:var(--g);color:#fff;font-weight:700;border-radius:999px;padding:.6rem 1.05rem}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 1.1rem 1.5rem}
h2{font-size:1.4rem;margin:1.6rem 0 .8rem}
.hero{display:flex;gap:1rem;align-items:center;background:var(--hero);border-radius:20px;padding:1rem;margin-top:.8rem}
.hero .cv{width:34%;flex:none;border-radius:12px}
.hero b{display:block;font-size:1.1rem;line-height:1.25;margin-bottom:.3rem}
.hero span{color:var(--mu);font-size:.95rem}
.hero button{margin-top:.9rem;background:var(--g);color:#fff;font-weight:700;border-radius:999px;padding:.65rem 1.1rem}
.row{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1.1rem;padding:0 1.1rem;scrollbar-width:none}
.row .bk{flex:none;width:max(150px,42vw);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem .9rem}
.bk{cursor:pointer;position:relative}
.cv{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden}
.cv img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:84%;max-width:80%;object-fit:contain;box-shadow:0 4px 14px #0004;background:#fff}
.cv i{position:absolute;left:0;bottom:0;height:5px;background:var(--g);z-index:2}
.bk p{margin:.55rem 0 0;font-weight:600;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk small{color:var(--mu)}
.rm{position:absolute;top:.4rem;right:.4rem;width:2rem;height:2rem;border-radius:50%;background:#000a;color:#fff;font-size:1.1rem;z-index:3}
.empty{background:var(--hero);border-radius:20px;padding:1.6rem 1.2rem;margin-top:1rem}
.empty b{display:block;font-size:1.3rem;margin-bottom:.4rem}
.empty p{margin:0 0 1rem;color:var(--mu);line-height:1.45}
.tabs{display:flex;border-top:1px solid var(--ln);background:var(--bg)}
.tabs button{flex:1;padding:.7rem 0 .75rem;color:var(--mu);font-size:.85rem}
.tabs button.on{color:var(--g);font-weight:700}
.tabs span{display:block;font-size:1.3rem;margin-bottom:.1rem}
.av{cursor:pointer;overflow:hidden}.av img{width:100%;height:100%;display:block;object-fit:cover}.av:has(img){background:#050505}.av.big{width:5rem;height:5rem;font-size:2.2rem;border-radius:20px;flex:none}
.me{display:flex;gap:1rem;align-items:flex-end;margin-top:1rem}.me label{flex:1;font-weight:600;font-size:.9rem;color:var(--mu)}
.me input{display:block;width:100%;margin-top:.35rem;padding:.75rem .9rem;border:1px solid var(--ln);border-radius:12px;background:var(--tint);color:var(--tx);font:inherit;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.2rem}.stats div{background:var(--tint);border-radius:14px;padding:.9rem .5rem;text-align:center}.stats b{display:block;font-size:1.6rem}.stats span{color:var(--mu);font-size:.8rem}
.seg{display:flex;background:var(--tint);border-radius:999px;padding:.25rem}.seg button{flex:1;padding:.55rem 0;border-radius:999px;color:var(--mu)}.seg button.on{background:var(--g);color:#fff;font-weight:700}
.mu{color:var(--mu);margin:0 0 .8rem}
.avw{position:relative;flex:none;border-radius:20px}.avw .av{pointer-events:none}.plus{position:absolute;right:-.3rem;bottom:-.3rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;border:2px solid var(--bg);line-height:1}.rmf{color:var(--g);text-decoration:underline;padding:0;margin:.4rem 0 0;font-size:.85rem}
#perm{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:30;padding:1rem}.dlg{background:var(--bg);border-radius:20px;padding:1.3rem;max-width:26rem;width:100%;display:flex;flex-direction:column;gap:.7rem}.dlg b{font-size:1.2rem}.dlg p{margin:0;color:var(--mu);line-height:1.45}.dlg button:last-child{color:var(--mu);padding:.5rem}
#toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#000c;color:#fff;padding:.6rem 1rem;border-radius:999px;font-size:.9rem;z-index:20}
#reader{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,var(--desk),var(--desk2));color:#f3ecd9;font-family:Georgia,serif}
.top,.bot{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:var(--bar)}
.top button,.bot button{border:1px solid #ffffff30;border-radius:8px;padding:.5rem .8rem}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px;touch-action:pan-y}
#book{position:relative;display:flex;width:var(--pw);height:var(--ph);perspective:2400px}
#book.dual{width:calc(var(--pw)*2)}
.pg{width:var(--pw);height:var(--ph);background:#fbf8ef;overflow:hidden;box-shadow:0 10px 30px #0007}
.pg img{display:block;width:100%;height:100%;object-fit:contain}
#book:not(.dual) #L{display:none}
#L{border-radius:3px 0 0 3px;box-shadow:inset -22px 0 24px -18px #0006,0 10px 30px #0007}
#book.dual #R{border-radius:0 3px 3px 0;box-shadow:inset 22px 0 24px -18px #0006,0 10px 30px #0007}
#L.blank{visibility:hidden}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;transition:transform .65s cubic-bezier(.5,.05,.3,1);z-index:5}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.bck{left:0;transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.bck.go{transform:rotateY(180deg)}
.leaf .f,.leaf .b{position:absolute;inset:0;background:#fbf8ef;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf .b{transform:rotateY(180deg)}
.leaf img{width:100%;height:100%;object-fit:contain;display:block}
#rng{flex:1;min-width:0;accent-color:var(--brass)}
#lbl{font-size:.85rem;color:#a9b8ae;white-space:nowrap}
.nav{width:2.6rem;padding:.5rem 0;font-size:1.2rem;line-height:1}
@media(prefers-reduced-motion:reduce){.leaf{transition-duration:.01s}}
</style>
</head>
<body>
<section id="home">
  <div class="hd"><div class="av" role="img" aria-label="Perfil"></div><h1>Entrelinhas</h1><button class="pill" id="add">+ PDF</button></div>
  <div id="main"></div>
  <nav class="tabs"><button data-t="home" class="on"><span>🏠</span>Início</button><button data-t="shelf"><span>📚</span>Estante</button><button data-t="me"><span>👤</span>Perfil</button></nav>
</section>
<section id="reader" hidden>
  <div class="top"><button id="back">‹ Voltar</button><div id="title"></div></div>
  <div id="stage"><div id="book" class="dual"><div id="L" class="pg blank"></div><div id="R" class="pg"></div></div></div>
  <div class="bot">
    <button class="nav" id="prev" aria-label="Página anterior">‹</button>
    <input id="rng" type="range" min="1" max="1" value="1" aria-label="Ir para a página">
    <span id="lbl"></span>
    <button class="nav" id="next" aria-label="Próxima página">›</button>
  </div>
</section>
<input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
<input id="photo" type="file" accept="image/*" hidden>
<div id="toast" hidden></div>
<div id="perm" hidden><div class="dlg" role="dialog" aria-labelledby="pt"><b id="pt">Permitir acesso aos arquivos</b><p>Para adicionar PDFs, o app precisa abrir os arquivos do seu aparelho e guardar os livros no armazenamento dele. Você escolhe quais PDFs entram; o app não vê o resto dos seus arquivos.</p><button class="pill" id="ok">Permitir e escolher PDF</button><button id="no">Agora não</button></div></div>

<script>
const $=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- armazenamento (IndexedDB, com reserva em memória) ---------- */
let mem=[];
const dbp=new Promise(res=>{try{const r=indexedDB.open('livros',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('b',{keyPath:'id'});r.result.createObjectStore('f',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function tx(st,mode,fn){const d=await dbp;if(!d)return null;
  return new Promise(res=>{try{const t=d.transaction(st,mode),r=fn(t.objectStore(st));
    t.oncomplete=()=>res(r&&r.result===undefined?true:r&&r.result);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}})}
async function getAll(){const r=await tx('b','readonly',s=>s.getAll());return Array.isArray(r)?r:mem}
async function put(b,blob){
  const m={...b};delete m.blob;
  const ok=await tx('b','readwrite',s=>s.put(m));
  if(ok&&blob)await tx('f','readwrite',s=>s.put({id:b.id,blob}));
  if(!ok){const i=mem.findIndex(x=>x.id===b.id);const v={...m,blob:blob||(mem[i]&&mem[i].blob)};if(i<0)mem.push(v);else mem[i]=v}
}
async function getBlob(id){const r=await tx('f','readonly',s=>s.get(id));if(r&&r.blob)return r.blob;const m=mem.find(x=>x.id===id);return m&&m.blob}
async function del(id){await tx('b','readwrite',s=>s.delete(id));await tx('f','readwrite',s=>s.delete(id));mem=mem.filter(x=>x.id!==id)}

/* ---------- abrir PDF ---------- */
async function mkCover(doc){
  const p=await doc.getPage(1),v=p.getViewport({scale:1}),vp=p.getViewport({scale:300/v.width});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const s=document.createElement('canvas');s.width=s.height=1;const x=s.getContext('2d');x.drawImage(c,0,0,1,1);
  const d=x.getImageData(0,0,1,1).data;
  return{cover:c.toDataURL('image/jpeg',.8),col:`rgb(${d[0]},${d[1]},${d[2]})`,ratio:v.width/v.height};
}
$('#file').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';
  if(!fs.length)return;
  if(fs.length>1)return addMany(fs);
  const f=fs[0];
  if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))return toast('Escolha um arquivo no formato PDF.');
  toast('Abrindo o livro…');
  try{
    const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    let b=(await getAll()).find(x=>x.name===f.name.replace(/\.pdf$/i,'')&&x.size===f.size);
    if(!b){b={id:Date.now()+'',name:f.name.replace(/\.pdf$/i,''),size:f.size,n:doc.numPages,page:1,t:Date.now(),...await mkCover(doc)};await put(b,f)}
    startRead(b,doc);
  }catch(err){toast('Não consegui abrir este PDF. Ele pode estar protegido por senha ou danificado.')}
});
async function addMany(fs){
  let k=0;toast('Adicionando '+fs.length+' PDFs…');
  for(const f of fs){
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))continue;
    try{
      const name=f.name.replace(/\.pdf$/i,'');
      if((await getAll()).some(x=>x.name===name&&x.size===f.size))continue;
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      await put({id:Date.now()+'-'+k,name,size:f.size,n:doc.numPages,page:1,t:Date.now(),started:false,...await mkCover(doc)},f);k++;
    }catch(e){}
  }
  toast(k?k+' PDF(s) na estante':'Nenhum PDF novo foi adicionado');
  tab='shelf';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='shelf'));render();
}
async function openBook(id){
  const b=(await getAll()).find(x=>x.id===id),bl=await getBlob(id);
  if(!b||!bl)return toast('Não encontrei o arquivo deste livro. Adicione o PDF de novo.');
  try{startRead(b,await pdfjsLib.getDocument({data:await bl.arrayBuffer()}).promise)}
  catch(e){toast('Não consegui abrir este livro.')}
}

/* ---------- leitor em formato de livro ---------- */
let pdf,cur,n=0,ratio=.707,cache=new Map(),sp=0,dual=true,busy=false,pw=300,ph=420;
const total=()=>dual?Math.floor(n/2)+1:n;
const slots=s=>dual?[2*s,2*s+1].map(p=>p>n?0:p):[0,s+1];
const first=s=>slots(s).find(Boolean)||1;
function layout(){
  const st=$('#stage'),w=st.clientWidth-24,h=st.clientHeight-24,pg=n?first(sp):1;
  const d=w>=h*ratio*1.7,p=Math.max(80,Math.min(d?w/2:w,h*ratio));
  if(Math.round(p)!==Math.round(pw))cache.clear();
  dual=d;pw=p;ph=p/ratio;
  const b=$('#book');b.style.setProperty('--pw',pw+'px');b.style.setProperty('--ph',ph+'px');
  b.classList.toggle('dual',dual);$('#rng').max=n;
  sp=dual?Math.floor(pg/2):pg-1;
}
async function img(p){
  if(!p)return null;if(cache.has(p))return cache.get(p);
  const page=await pdf.getPage(p),v=page.getViewport({scale:1});
  const k=pw*Math.min(2,window.devicePixelRatio||1)/v.width,vp=page.getViewport({scale:k});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const u=c.toDataURL('image/jpeg',.88);cache.set(p,u);return u;
}
const set=(el,u)=>{el.innerHTML=u?'<img alt="" src="'+u+'">':'';el.classList.toggle('blank',!u)};
async function go(t,anim=true){
  t=Math.max(0,Math.min(total()-1,t));
  if(busy||(anim&&t===sp))return;busy=true;
  const old=sp,[ol,or]=slots(old),[nl,nr]=slots(t);
  const [iol,ior,inl,inr]=await Promise.all([img(ol),img(or),img(nl),img(nr)]);
  const L=$('#L'),R=$('#R'),fwd=t>old;
  if(anim&&t!==old&&dual){
    const leaf=document.createElement('div');leaf.className='leaf '+(fwd?'fwd':'bck');
    const fr=fwd?ior:iol,bk=fwd?inl:inr;
    leaf.innerHTML='<div class="f">'+(fr?'<img alt="" src="'+fr+'">':'')+'</div><div class="b">'+(bk?'<img alt="" src="'+bk+'">':'')+'</div>';
    if(fwd)set(R,inr);else set(L,inl);
    $('#book').appendChild(leaf);leaf.getBoundingClientRect();leaf.classList.add('go');
    await new Promise(r=>setTimeout(r,680));
    set(L,inl);set(R,inr);leaf.remove();
  }else{
    set(L,inl);set(R,inr);
    if(anim&&t!==old&&!matchMedia('(prefers-reduced-motion:reduce)').matches)
      R.animate([{transform:'translateX('+(fwd?36:-36)+'px)',opacity:0},{transform:'none',opacity:1}],{duration:280,easing:'ease-out'});
  }
  sp=t;
  const ps=slots(t).filter(Boolean);
  $('#lbl').textContent=(ps.length>1?'Páginas '+ps[0]+'–'+ps[1]:'Página '+ps[0])+' de '+n;
  $('#rng').value=ps[0];$('#prev').disabled=t===0;$('#next').disabled=t===total()-1;
  if(cur&&anim!==null){cur.page=ps[0];cur.t=Date.now();put(cur)}
  busy=false;
  slots(t+1).concat(slots(t-1)).forEach(p=>{if(p>0&&p<=n)img(p)});
}
async function startRead(b,doc){
  pdf=doc;n=doc.numPages;cur=b;b.started=true;cache.clear();ratio=b.ratio||.707;busy=false;
  $('#title').textContent=b.name;$('#home').hidden=true;$('#reader').hidden=false;
  sp=0;dual=true;layout();
  const pg=Math.min(n,Math.max(1,b.page||1));
  sp=dual?Math.floor(pg/2):pg-1;
  await go(sp,false);
}
$('#back').onclick=async()=>{$('#reader').hidden=true;$('#home').hidden=false;cur=null;await render()};
$('#prev').onclick=()=>go(sp-1);
$('#next').onclick=()=>go(sp+1);
$('#rng').addEventListener('input',e=>{const v=+e.target.value;go(dual?Math.floor(v/2):v-1)});
document.addEventListener('keydown',e=>{
  if($('#reader').hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(sp+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(sp-1);
});
$('#stage').addEventListener('click',e=>{
  const r=$('#book').getBoundingClientRect();
  if(e.clientY<r.top||e.clientY>r.bottom)return;
  go(e.clientX<r.left+r.width/2?sp-1:sp+1);
});
let tx0=null;
$('#stage').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
$('#stage').addEventListener('touchend',e=>{
  if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;
  if(Math.abs(dx)>50){e.preventDefault();go(dx<0?sp+1:sp-1)}
});
let rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!n||$('#reader').hidden)return;layout();busy=false;go(sp,false)},200)});
$('.av').onclick=()=>$('[data-t="me"]').click();
applyTheme();avatar();render();
</script>
</body>
</html>
